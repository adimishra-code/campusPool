name: Deploy

# Manual-only scaffold. This does NOT run on push/PR — trigger it from the
# Actions tab once you've added the registry/host secrets below. It builds and
# pushes the api + web images to GitHub Container Registry (GHCR); wire the
# final "deploy" step to your host (Render/Railway/Fly/SSH) as needed.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: master

# Required secrets / config (add under Settings → Secrets and variables):
#   - GITHUB_TOKEN is provided automatically for GHCR.
#   - VITE_API_URL / VITE_SOCKET_URL: build args for the frontend image.
#   - Any host deploy credentials your final step needs.
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-and-push:
    # Guard so a fork/accidental run without opt-in does nothing.
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest

      - name: Build & push web image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }}
            VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest

      # - name: Deploy to host
      #   run: echo "Wire this to Render/Railway/Fly deploy hook or SSH pull+restart."
