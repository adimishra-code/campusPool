<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a7a4b" />
    <meta name="description" content="CampusPool — share verified student rides on your campus." />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://campuspool.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / social defaults (per-route values are set at runtime via react-helmet) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CampusPool" />
    <meta property="og:title" content="CampusPool — Student ride sharing" />
    <meta property="og:description" content="Share verified student rides on your campus." />
    <meta property="og:url" content="https://campuspool.app/" />
    <meta property="og:image" content="https://campuspool.app/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CampusPool — Student ride sharing" />
    <meta name="twitter:description" content="Share verified student rides on your campus." />
    <meta name="twitter:image" content="https://campuspool.app/og-image.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>CampusPool — Student ride sharing</title>

    <!-- Structured data for richer search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CampusPool",
        "description": "Verified student ride sharing for campuses.",
        "url": "https://campuspool.app/",
        "logo": "https://campuspool.app/favicon.svg",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "email": "adityamishrav820@gmail.com"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CampusPool",
        "url": "https://campuspool.app/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
